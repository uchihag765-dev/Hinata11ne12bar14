
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hinata Namikaze 💜 AI Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eee5f7;color:#30213c}
header{background:linear-gradient(135deg,#7046a0,#a879ce);color:white;padding:17px;display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#f3e5ff;font-size:27px}
h1{font-size:19px;margin:0 0 5px}
header p{margin:0;font-size:12px;color:#f2e8ff}
main{max-width:700px;margin:auto;padding:14px}
.intro{background:white;padding:16px;border-radius:15px;margin-bottom:13px;box-shadow:0 3px 12px #52336b12}
.intro h2{font-size:17px;margin:0 0 8px;color:#7046a0}
.intro p{font-size:14px;line-height:1.6;margin:0}
.chatbox{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 15px #52336b18}
.chathead{background:#f5edfc;padding:13px;font-weight:bold;color:#7046a0}
iframe{display:block;width:100%;height:70dvh;min-height:450px;border:0;background:white}
footer{text-align:center;font-size:11px;color:#786b83;padding:14px}
@media(min-width:600px){main{padding-top:22px}iframe{height:650px}}
</style>
</head>
<body>
<header>
  <div class="avatar">💜</div>
  <div>
    <h1>Hinata Namikaze</h1>
    <p>Your anime chat corner 🌸</p>
  </div>
</header>

<main>
  <section class="intro">
    <h2>Welcome! 🌸</h2>
    <p>হাই! 💜 এখানে তুমি AI-এর সঙ্গে কথা বলতে পারবে। বাংলা, Banglish অথবা English-এ মেসেজ পাঠাও।</p>
  </section>

  <section class="chatbox">
    <div class="chathead">💬 AI Chat</div>
    <iframe
      src="https://hinata-chat-73.uchihag765.workers.dev/"
      title="Hinata AI Chat"
      loading="eager"
      allow="clipboard-write"
    ></iframe>
  </section>
</main>

<footer>Fan-made anime experience • Made with 💜</footer>
</body>
</html>
